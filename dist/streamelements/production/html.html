<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<main id="pumpkin-widget" class="pumpkin-widget" data-identity-status="loading" data-alignment="left" aria-live="polite" hidden>
  <section id="identity-card" class="identity-card" hidden>
    <small>KÜRBISKÖNIG EVENT</small>
    <strong id="identity-title">Verbindung wird geprüft …</strong>
    <span id="identity-detail"></span>
  </section>

  <section id="boss-card" class="boss-card" hidden>
    <small>GLOBALER BOSS</small>
    <h1 id="boss-name">Kürbiskönig</h1>
    <div class="health-track"><i id="health-fill"></i></div>
    <div class="boss-readout">
      <strong id="boss-hp">Eventdaten werden geladen …</strong>
      <strong id="boss-percent"></strong>
    </div>
    <span id="event-state" hidden></span>
  </section>

  <section id="minion-card" class="minion-card" hidden></section>

  <aside id="debug-panel" class="debug-panel" hidden>
    <strong>STREAM ELEMENTS LIVE-DIAGNOSE</strong>
    <dl>
      <div><dt>Channel</dt><dd id="debug-channel">–</dd></div>
      <div><dt>Streamer</dt><dd id="debug-streamer">loading</dd></div>
      <div><dt>Event</dt><dd id="debug-event">–</dd></div>
      <div><dt>Supabase</dt><dd id="debug-supabase">disconnected</dd></div>
      <div><dt>Realtime</dt><dd id="debug-realtime">disconnected</dd></div>
      <div><dt>Boss</dt><dd id="debug-boss">not loaded</dd></div>
      <div><dt>Minion</dt><dd id="debug-minion">none</dd></div>
      <div><dt>Last Sync</dt><dd id="debug-sync">never</dd></div>
      <div><dt>Last Action</dt><dd id="debug-action">none</dd></div>
    </dl>
  </aside>

  <div id="curse-layer" class="curse-layer" hidden aria-hidden="true">
    <div class="curse-vignette"></div><i></i><i></i><i></i>
  </div>
</main>
