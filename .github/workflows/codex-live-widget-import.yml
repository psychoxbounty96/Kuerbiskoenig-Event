name: Codex Live Widget Import

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import tested live-widget patch
        run: |
          curl -fL -o /tmp/live.bundle https://github.com/psychoxbounty96/Kuerbiskoenig-Event/releases/download/codex-live-widget-upload/live-widget-readiness.bundle
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch /tmp/live.bundle refs/heads/codex-live-widget-upload:refs/remotes/codex-upload/main
          git cherry-pick 214ed3a1af3d02002393e42ee4fbe5058fd3fc84
          git push origin HEAD:main
