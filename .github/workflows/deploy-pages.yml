name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      VITE_DATA_PROVIDER: supabase
      VITE_EVENT_SLUG: ${{ vars.EVENT_SLUG }}
      VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate public configuration
        run: npm run check:pages-env

      - name: Build standalone StreamElements packages
        run: npm run build:widget

      - name: Upload StreamElements packages
        uses: actions/upload-artifact@v4
        with:
          name: streamelements-widget
          path: dist/streamelements

      - name: Build static website
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: github-pages-dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
