name: Apply Codex minion artwork update

on:
  push:
    branches: [main]
    paths:
      - codex-minion-artwork-update.zip

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply prepared project update
        run: |
          unzip -o codex-minion-artwork-update.zip
          rm codex-minion-artwork-update.zip

      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add minion placeholder artwork to overlays"
          git push origin main
